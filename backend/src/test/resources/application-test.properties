# 결제 테스트 전용 (@ActiveProfiles("test")) : MariaDB 없이 H2 인메모리 DB로 실행
spring.datasource.url=jdbc:h2:mem:oneslot_payment;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 스케줄러는 끄고 테스트에서 직접 실행
payment.expiration.enabled=false
toss.secret-key=test_sk_dummy
