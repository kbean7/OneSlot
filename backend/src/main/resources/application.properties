
# OneSlot Spring Boot
spring.application.name=reservation
server.port=8080

# MariaDB
spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/reservation_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (로컬 개발용 기본값. 시연·배포 때는 환경변수 JWT_SECRET 으로 32자 이상 값을 넣을 것)
jwt.secret=${JWT_SECRET:oneslot-local-dev-secret-change-me-0123456789}
jwt.expiration-minutes=120

# CORS (Vite 개발 서버)
cors.allowed-origins=http://localhost:5173

# 관리자 계정 자동 생성: ADMIN_PASSWORD 환경변수가 있을 때만 만든다
admin.login-id=admin
admin.password=${ADMIN_PASSWORD:}

# 공간 사진 업로드 (jpg·png, 장당 5MB, 최대 5장)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=uploads
